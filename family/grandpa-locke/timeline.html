<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <style>
        :root {
            --timeline-color: #ffffff;
            --event-marker-color: #e4f2efc1;
            --background-color: #333333;
            --text-color: #ffffff;
            --timeline-line-width: 1px;
            --major-tick-width: 15px;
            --major-tick-thickness: 1px;
            --minor-tick-width: 5px;
            --minor-tick-thickness: 1px;
            --event-marker-diameter: 5px;
            --timeline-event-line-thickness: 1px;
            --situation-box-width: 5px;
            --text-color: #ffffff;
            --text-size: 12px;
            --text-buffer: 5px;
        }

        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #333333;
            font-family: 'Inter', sans-serif;
            font-size: var(--text-size);
            color: var(--text-color);
        }

        body {
            width: 100%;
            height: 100%;
        }

        .content {
            display: flex;
            width: fit-content;
            height: 5000px;
            position: absolute;
            overflow: hidden;
            padding: 10px;
        }

        .content-column {
            display: flex;
            position: relative;
        }

        .left-events {
            width: 150px;
            /* background-color: #ff8c00; */
            z-index: 250
        }

        .left-lines {
            width: 100px;
            /* background-color: #8400ff; */
            z-index: 500
        }

        .timeline {
            width: var(--timeline-line-width);
            background-color: var(--timeline-color);
            z-index: 1000
        }

        .right-lines {
            width: 200px;
            /* background-color: #4e4d27; */
            z-index: 500
        }

        .right-events {
            width: 400px;
            /* background-color: #545265; */
            z-index: 250
        }

        .timeline-tick {
            position: absolute;
            transform: translateX(-50%) translateY(-50%);
            background-color: var(--timeline-color);
        }

        .timeline-tick-major {
            width: var(--major-tick-width);
            height: var(--major-tick-thickness);
        }

        .timeline-tick-minor {
            width: var(--minor-tick-width);
            height: var(--minor-tick-thickness);
        }

        .timeline-label {
            position: absolute;
            transform: translateX(-100%) translateX(calc(-1*var(--major-tick-width)/2)) translateY(-50%);
            text-align: right;
            padding: var(--text-buffer);
            white-space: nowrap;
        }

        .event-marker {
            position: absolute;
            transform: translateX(-50%) translateY(-50%);
            width: var(--event-marker-diameter);
            height: var(--event-marker-diameter);
            background-color: var(--event-marker-color);
            border-radius: 50%;
        }

        .event-line {
            position: absolute;
            transform: translateY(-50%);
            width: 100%;
            height: var(--timeline-event-line-thickness);
            background-color: var(--event-marker-color);
        }

        .text-container {
            position: absolute;
            transform: translateY(-50%);
            width: 100%;
            height: fit-content;
            padding: var(--text-buffer);
            white-space: nowrap;
            box-sizing: border-box;
        }

        .situation-box {
            position: absolute;
            transform: translateX(-50%);
            width: var(--situation-box-width);
            border-radius: var(--situation-box-width);
        }

        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .tooltiptext {
            visibility: hidden;
            width: 120px;
            /* Adjust as needed */
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
            /* Ensure it appears above other elements */
            bottom: 125%;
            /* Position above the text */
            left: 50%;
            margin-left: -60px;
            /* Center the tooltip */
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        .hover-glow:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7)
        }
    </style>
</head>

<body>

    <div id="content" class="content">
        <div id="left-events" class="content-column left-events"></div>
        <div id="left-lines" class="content-column left-lines"></div>
        <div id="timeline" class="content-column timeline"></div>
        <div id="right-lines" class="content-column right-lines"></div>
        <div id="right-events" class="content-column right-events"></div>
    </div>

    <script>
        var uidCounter = 0;
        function newSequentialUid() {
            return `id${uidCounter++}`;
        }

        function ezDate(year, month, day) {
            return new Date(year, month - 1, day);
        }

        const startYear = 1939;
        const endYear = 1968;

        const worldEvents = [
            { date: ezDate(1939, 9, 1), name: 'Germany invades Poland', detail: '' },
            { date: ezDate(1941, 12, 7), name: 'Pearl Harbor', detail: '' },
            { date: ezDate(1944, 6, 6), name: 'D-Day', detail: '' },
            { date: ezDate(1945, 5, 8), name: 'Germany surrenders', detail: '' },
            // { date: ezDate(1945, 8, 6), name: 'Hiroshima', detail: '' },
            // { date: ezDate(1945, 8, 9), name: 'Nagasaki', detail: '' },
            { date: ezDate(1945, 8, 15), name: 'Japan surrenders', detail: '' },
            { date: ezDate(1950, 6, 25), name: 'Korean War begins', detail: '' },
            { date: ezDate(1953, 7, 27), name: 'Korean War ends', detail: '' },
            { date: ezDate(1955, 11, 1), name: 'Vietnam War begins', detail: '' },
            { date: ezDate(1964, 8, 2), name: 'Gulf of Tonkin incident', detail: '' },
            { date: ezDate(1975, 4, 30), name: 'Vietnam War ends', detail: '' },
        ];

        const wars = [
            { startDate: ezDate(1939, 9, 1), endDate: ezDate(1945, 8, 15), name: 'WWII' },
            { startDate: ezDate(1950, 6, 25), endDate: ezDate(1953, 7, 27), name: 'Korean War' },
            { startDate: ezDate(1955, 11, 1), endDate: ezDate(1975, 4, 30), name: 'Vietnam War' }
        ];

        const battles = [
            { startDate: ezDate(1940, 5, 26), endDate: ezDate(1940, 6, 4), name: 'Dunkirk' },
            { startDate: ezDate(1940, 7, 10), endDate: ezDate(1940, 10, 31), name: 'Battle of Britain' },
            { startDate: ezDate(1941, 9, 8), endDate: ezDate(1944, 1, 27), name: 'Linengrad' },
            { startDate: ezDate(1941, 10, 2), endDate: ezDate(1942, 1, 2), name: 'Moscow' },
            { startDate: ezDate(1942, 6, 4), endDate: ezDate(1942, 6, 7), name: 'Midway' },
            { startDate: ezDate(1942, 8, 7), endDate: ezDate(1943, 2, 9), name: 'Guadalcanal' },
            { startDate: ezDate(1942, 8, 23), endDate: ezDate(1943, 2, 2), name: 'Stalingrad' },
            { startDate: ezDate(1944, 6, 6), endDate: ezDate(1944, 8, 30), name: 'Operation Overlord' },
            { startDate: ezDate(1944, 10, 23), endDate: ezDate(1944, 10, 26), name: 'Leyte Gulf' },
            { startDate: ezDate(1944, 12, 16), endDate: ezDate(1945, 1, 28), name: 'Battle of the Bulge' },
            { startDate: ezDate(1945, 2, 19), endDate: ezDate(1945, 3, 26), name: 'Iwo Jima' },
            { startDate: ezDate(1945, 4, 1), endDate: ezDate(1945, 6, 22), name: 'Okinawa' },
            { startDate: ezDate(1945, 4, 16), endDate: ezDate(1945, 5, 2), name: 'Battle of Berlin' },
        ];

        const locations = [
            { startDate: ezDate(1944, 2, 21), endDate: ezDate(1945, 9, 20), name: 'ETO' },
            { startDate: ezDate(1959, 10, 9), endDate: ezDate(1960, 10, 11), name: 'Korea' },
            { startDate: ezDate(1964, 11, 16), endDate: ezDate(1967, 5, 18), name: 'Turkey' },
        ];

        const ranks = [
            { startDate: ezDate(1941, 4, 5), endDate: ezDate(1941, 7, 15), name: 'Private', abbv: 'Pvt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1941, 7, 16), endDate: ezDate(1941, 8, 7), name: 'Private First Class', abbv: 'Pfc.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1941, 8, 8), endDate: ezDate(1941, 10, 26), name: 'Corporal?', abbv: 'Pfc.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1941, 10, 27), endDate: ezDate(1942, 1, 2), name: 'Sergeant', abbv: 'Sgt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1942, 1, 3), endDate: ezDate(1942, 4, 16), name: 'Staff Sergeant', abbv: 'S/Sgt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1942, 4, 17), endDate: ezDate(1942, 8, 13), name: 'Technician Third Grade', abbv: 'T/3', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1942, 8, 14), endDate: ezDate(1943, 3, 19), name: '2nd Lieutenant', abbv: '2Lt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1943, 3, 20), endDate: ezDate(1944, 2, 3), name: '1st Lieutenant', abbv: '1Lt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1944, 2, 4), endDate: ezDate(1952, 8, 19), name: 'Captain', abbv: 'Capt.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1952, 8, 20), endDate: ezDate(1960, 12, 12), name: 'Major', abbv: 'Maj.', insignia: '', corps: '', corpsInsignia: '' },
            { startDate: ezDate(1960, 12, 13), endDate: ezDate(1967, 5, 31), name: 'Lieutenant Colonel', abbv: 'LtC.', insignia: '', corps: '', corpsInsignia: '' },
        ];

        const units = [
            { startDate: ezDate(1964, 11, 16), endDate: ezDate(1967, 5, 18), name: 'Turkey' },
        ];

        const events = [
            { date: ezDate(1941, 4, 5), name: 'Inducted at Ft. Barrancas', detail: '' },
            { date: ezDate(1941, 7, 16), name: 'Promoted to Private 1st Class', detail: '' },
            { date: ezDate(1941, 10, 27), name: 'Promoted to Sergeant', detail: '' },
            { date: ezDate(1942, 1, 3), name: 'Promoted to Staff Sergeant', detail: '' },
            { date: ezDate(1942, 4, 17), name: 'Promoted to Technician 3rd Grade', detail: '' },
            { date: ezDate(1942, 5, 25), name: 'Started Quartermaster School', detail: '' },
            { date: ezDate(1942, 8, 13), name: 'Graduated Quartermaster School', detail: '' },
            //  { date: ezDate(1942, 8, 14), name: 'Promoted to 2nd Lieutenant', detail: '' },
            { date: ezDate(1943, 3, 20), name: 'Promoted to 1st Lieutenant', detail: '' },
            { date: ezDate(1944, 2, 4), name: 'Promoted to Captain', detail: '' },
            { date: ezDate(1952, 8, 20), name: 'Promoted to Major', detail: '' },
            { date: ezDate(1954, 2, 28), name: 'Transferred from Quartermaster Corps to Transportation Corps', detail: '' },
            { date: ezDate(1960, 12, 13), name: 'Promoted to Lieutenant Colonel', detail: '' },
            { date: ezDate(1967, 5, 31), name: 'Retired', detail: '' },
        ];

        const startTime = ezDate(startYear, 1, 1).getTime();
        const endTime = ezDate(endYear, 1, 1).getTime();
        const timeSpan = endTime - startTime;

        function dateToTimelineCoordinate(date) {
            return (100 * (date.getTime() - startTime) / timeSpan).toFixed(2) + '%';
        }

        function durationToTimelineSpan(start, end) {
            const percent = (100 * (end.getTime() - start.getTime()) / timeSpan).toFixed(2);
            return percent > 100 ? '100%' : percent + '%';
        }

        function drawTimeline() {
            const timeline = document.querySelector('#timeline');
            for (let year = startYear; year <= endYear; year++) {
                const y = dateToTimelineCoordinate(ezDate(year, 1, 1));

                const tick = document.createElement('div');
                tick.classList.add('timeline-tick');
                tick.classList.add('timeline-tick-major');
                tick.style.top = y;
                timeline.appendChild(tick);

                const yearLabel = document.createElement('label');
                yearLabel.classList.add('timeline-label');
                yearLabel.textContent = year.toString(10);
                yearLabel.style.top = y;
                timeline.appendChild(yearLabel);

                if (year == endYear) break;

                for (let month = 2; month <= 12; month++) {
                    const tick = document.createElement('div');
                    tick.classList.add('timeline-tick');
                    tick.classList.add('timeline-tick-minor');
                    tick.style.top = dateToTimelineCoordinate(ezDate(year, month, 1));
                    timeline.appendChild(tick);
                }
            }
        }

        function drawTimelineEvent(date, displayLeft, name) {
            const timeline = document.querySelector('#timeline');
            const y = dateToTimelineCoordinate(date);

            const dot = document.createElement('div');
            dot.classList.add('event-marker');
            dot.style.top = y;
            timeline.appendChild(dot);

            const lineContainer = document.querySelector(displayLeft ? '#left-lines' : '#right-lines');
            const line = document.createElement('div');
            line.classList.add('event-line');
            line.style.top = y;
            lineContainer.appendChild(line);

            const labelContainer = document.querySelector(displayLeft ? '#left-events' : '#right-events');
            const labelText = document.createElement("label");
            labelText.classList.add("hover-glow");
            labelText.classList.add('text-container');
            labelText.textContent = name;
            labelText.style.top = y;
            if (displayLeft) {
                labelText.style.textAlign = 'right';
            } else {
                labelText.style.textAlign = 'left';
            }
            labelContainer.appendChild(labelText);
        }

        function drawSituationBox(startDate, endDate, name, color, offset, right) {
            const containerID = right ? '#right-lines' : '#left-lines';
            const container = document.querySelector(containerID);

            const tooltip = document.createElement('span');
            tooltip.classList.add('tooltiptext');
            tooltip.textContent = name;
            container.appendChild(tooltip);

            const box = document.createElement('div');
            box.classList.add('situation-box');
            box.classList.add('hover-glow');
            box.style.top = dateToTimelineCoordinate(startDate);
            box.style.height = durationToTimelineSpan(startDate, endDate);
            box.style.backgroundColor = color;
            if (right) {
                box.style.right = offset;
            } else {
                box.style.left = offset;
            }
            container.appendChild(box);
        }

        function drawWorldEvents() {
            worldEvents.forEach(event => {
                drawTimelineEvent(event.date, true, event.name);
            });
        }

        function drawEvents() {
            events.forEach(event => {
                drawTimelineEvent(event.date, false, event.name);
            });
        }

        function drawWars() {
            wars.forEach(war => {
                drawSituationBox(war.startDate, war.endDate, war.name, '#ff000088', '95%');
            });
        }

        function drawBattles() {
            let offset = 5;
            battles.forEach(battle => {
                offset += 6;
                drawSituationBox(battle.startDate, battle.endDate, battle.name, '#ff000088', `${offset}%`);
            });
        }

        function drawRanks() {
            ranks.forEach(rank => {
                drawSituationBox(rank.startDate, rank.endDate, rank.name, '#ff000088', '5%', true);
            });
        }

        function drawLocations() {
            locations.forEach(location => {
                drawSituationBox(location.startDate, location.endDate, location.name, '#ff000088', '10%', true);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            drawTimeline();
            drawWars();
            drawBattles();
            drawRanks();
            drawLocations();
            drawWorldEvents();
            drawEvents();
        });
    </script>

</body>

</html>
